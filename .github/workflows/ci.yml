#=============================================================================#
#                        GitHub Actions CI Pipeline                            #
#=============================================================================#
# Runs on every push to `master`, every pull request targeting `master`, and  #
# every tag pushed as `v*` (e.g. v1.0.0). It:                                 #
#   1. Builds the project (C++26, GCC 15, Release)                            #
#   2. Runs the full test suite (GoogleTest via CTest)                         #
#   3. Generates the Doxygen documentation (HTML)                              #
#   4. Publishes a GitHub Release (binary + docs) when a tag is pushed         #
#=============================================================================#

name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  CXX_COMPILER: g++-15

jobs:
  #----------------------------------------------------------------------------#
  # Job 1: Build + Test                                                        #
  #----------------------------------------------------------------------------#
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so CMake's git rev-parse works

      - name: Install toolchain (GCC 15, Ninja)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15 ninja-build
          echo "g++: $(g++-15 --version | head -n1)"
          echo "cmake: $(cmake --version | head -n1)"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_COMPILER=${{ env.CXX_COMPILER }}
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/main dist/quant-backtest-linux-x86_64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: quant-backtest-linux-x86_64
          path: dist/quant-backtest-linux-x86_64

  #----------------------------------------------------------------------------#
  # Job 2: Doxygen documentation                                               #
  #----------------------------------------------------------------------------#
  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Package documentation
        run: tar -czf quant-backtest-docs.tar.gz html/

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: quant-backtest-docs
          path: quant-backtest-docs.tar.gz

  #----------------------------------------------------------------------------#
  # Job 3: Publish GitHub Release (tags only)                                  #
  #----------------------------------------------------------------------------#
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-and-test, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            quant-backtest-linux-x86_64/quant-backtest-linux-x86_64
            quant-backtest-docs/quant-backtest-docs.tar.gz
